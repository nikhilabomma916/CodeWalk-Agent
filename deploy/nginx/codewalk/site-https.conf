# CODEWALK_PROXY_TLS=on: TLS termination on container port 8443; port 8080 redirects to HTTPS
# and serves ACME HTTP-01 challenges. Certificates are mounted read-only at /etc/nginx/tls
# (fullchain.pem, privkey.pem) and are never part of the image or the repository.

server {
    listen 8080 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CodeWalkTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # One HSTS header for every response (the backend also sends one in production).
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/codewalk/locations.conf;
}
