# CODEWALK_PROXY_TLS=off: plain HTTP on container port 8080.
# For local production-like runs, or behind a TLS-terminating load balancer that forwards HTTP
# (then set CODEWALK_PUBLIC_ORIGIN to the public https:// origin; see reverse-proxy.md).
server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/codewalk/locations.conf;
}
