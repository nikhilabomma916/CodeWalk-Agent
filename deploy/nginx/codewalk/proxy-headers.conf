# Upstream request settings shared by every proxied location.
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host keeps the port, so the backend's origin check sees the same origin as the browser.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
# Replaced, never appended: a client cannot inject addresses (the backend trusts this hop only).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
