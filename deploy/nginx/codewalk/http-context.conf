# CodeWalk Agent reverse proxy: http-context settings shared by both site modes.
# Copied to /etc/nginx/conf.d/ by 40-codewalk-site.sh. See docs/deployment/reverse-proxy.md.

server_tokens off;

# Docker's embedded DNS: upstreams are re-resolved, so a recreated container (new IP) is found.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream codewalk_frontend {
    zone codewalk_frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream codewalk_backend {
    zone codewalk_backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

# Request limits. The backend enforces CODEWALK_MAX_REQUEST_BODY_BYTES (6 MiB, larger than the
# 2 MiB source-file limit) with a JSON 413; this is the outer cap for anything larger.
client_max_body_size 8m;
client_body_buffer_size 128k;
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 60s;
large_client_header_buffers 4 16k;

# Compression for the frontend's text assets only (enabled per location). API responses carry
# per-user data next to a session cookie and are not compressed (BREACH).
gzip off;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

# Access log without query strings, cookies or authorization headers; correlated with backend
# logs through the request id that nginx sends as X-Request-ID.
log_format codewalk '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time rid=$request_id '
                    'upstream=$upstream_addr upstream_status=$upstream_status';
access_log /dev/stdout codewalk;
error_log /dev/stderr warn;
