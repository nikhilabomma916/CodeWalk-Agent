# Routing shared by both site modes. Routes match the application:
#   /api/...         FastAPI backend (every backend route is under /api/v1)
#   everything else  Next.js frontend (pages, /_next assets, /monaco editor files, /healthz)
# The backend's interactive docs are disabled in production and are not routed.

# Proxy liveness for the container health check (reveals nothing beyond "ok").
location = /nginx-health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
}

location /api/ {
    include /etc/nginx/codewalk/proxy-headers.conf;
    # AI requests may take up to CODEWALK_AI_TIMEOUT_SECONDS (90 s).
    proxy_read_timeout 120s;
    proxy_pass http://codewalk_backend;
    # error_page is not inherited once a location sets its own: list 413 here too.
    error_page 413 = @payload_too_large;
    error_page 502 503 504 = @backend_unavailable;
}

location /api/v1/agent/ {
    include /etc/nginx/codewalk/proxy-headers.conf;
    # One agent run may take up to CODEWALK_AGENT_TIMEOUT_SECONDS (240 s).
    proxy_read_timeout 300s;
    proxy_pass http://codewalk_backend;
    # error_page is not inherited once a location sets its own: list 413 here too.
    error_page 413 = @payload_too_large;
    error_page 502 503 504 = @backend_unavailable;
}

location /_next/static/ {
    include /etc/nginx/codewalk/proxy-headers.conf;
    proxy_read_timeout 30s;
    gzip on;
    proxy_pass http://codewalk_frontend;
}

location /monaco/ {
    include /etc/nginx/codewalk/proxy-headers.conf;
    proxy_read_timeout 30s;
    gzip on;
    proxy_pass http://codewalk_frontend;
}

location / {
    include /etc/nginx/codewalk/proxy-headers.conf;
    proxy_read_timeout 60s;
    gzip on;
    proxy_pass http://codewalk_frontend;
}

# Same error shape as the backend's own errors.
location @backend_unavailable {
    internal;
    default_type application/json;
    return 503 '{"error":{"code":"backend_unavailable","message":"The CodeWalk API is not reachable. Try again shortly.","request_id":"$request_id"}}';
}

location @payload_too_large {
    internal;
    default_type application/json;
    return 413 '{"error":{"code":"payload_too_large","message":"Request body too large.","request_id":"$request_id"}}';
}

error_page 413 = @payload_too_large;
