# Local development services for CodeWalk Agent.
#   docker compose up -d postgres      # start PostgreSQL
#   docker compose down                # stop (data is kept in the named volume)
#   docker compose down -v             # stop and delete all data
#
# Credentials come from the repository .env (see .env.example); the defaults are
# for local development only and the port is bound to localhost.
name: codewalk

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (semantic retrieval, Module 10). Debian-based:
    # a data volume first created by postgres:17-alpine needs a one-time REINDEX after switching
    # (musl and glibc order text differently) - see README "Upgrading the database image".
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codewalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-codewalk}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
