# Local development services for CodeWalk Agent. See docs/deployment/local-docker.md.
#
#   docker compose up -d postgres              # database only (backend/frontend on the host)
#   docker compose --profile app up -d --build # database + migrations + backend + frontend, hot reload
#   docker compose --profile app down          # stop (data is kept in the named volume)
#
# Never run "down -v" here unless you intend to delete the development database: -v removes the
# postgres-data volume and every project in it.
#
# Credentials come from the repository .env (see .env.example). Every port is bound to localhost.
# The production stack is docker-compose.prod.yml (separate project, separate volume).
name: codewalk

x-dev-backend: &dev-backend
  build:
    context: ./backend
  image: codewalk-backend:dev
  environment:
    CODEWALK_ENV: development
    CODEWALK_HOST: 0.0.0.0
    CODEWALK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codewalk}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@postgres:5432/${POSTGRES_DB:-codewalk}
    CODEWALK_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    CODEWALK_LOG_LEVEL: ${CODEWALK_LOG_LEVEL:-INFO}
    # Optional; the app runs without them and reports AI/retrieval as unavailable.
    CODEWALK_AI_ENABLED: ${CODEWALK_AI_ENABLED:-false}
    CODEWALK_AI_PROVIDER: ${CODEWALK_AI_PROVIDER:-}
    CODEWALK_AI_MODEL: ${CODEWALK_AI_MODEL:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    CODEWALK_AI_BASE_URL: ${CODEWALK_AI_BASE_URL:-}
    CODEWALK_AI_API_KEY: ${CODEWALK_AI_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    CODEWALK_AI_ALLOWED_MODELS: ${CODEWALK_AI_ALLOWED_MODELS:-}
    RAG_ENABLED: ${RAG_ENABLED:-false}
    RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
    VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    # Bind-mounted sources on Windows/macOS do not deliver file events: poll for reloads.
    WATCHFILES_FORCE_POLLING: "true"

services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (semantic retrieval, Module 10). Debian-based:
    # a data volume first created by postgres:17-alpine needs a one-time REINDEX after switching
    # (musl and glibc order text differently) - see README "Upgrading the database image".
    image: pgvector/pgvector:pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codewalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-codewalk}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume: creates the test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Profile "app": the application in containers, with hot reload -------------------------
  migrate:
    <<: *dev-backend
    profiles: [app]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *dev-backend
    profiles: [app]
    restart: unless-stopped
    init: true
    # CODEWALK_ENV=development: python -m app runs uvicorn with --reload on /app/app.
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "127.0.0.1:${CODEWALK_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    profiles: [app]
    build:
      context: ./frontend
      target: dev
    image: codewalk-frontend:dev
    restart: unless-stopped
    init: true
    environment:
      # The browser calls the backend directly on its published port during development.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${CODEWALK_PORT:-8000}/api/v1
    volumes:
      - ./frontend:/app
      # Linux dependencies and build cache stay in the container, not in the host checkout.
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-next:
